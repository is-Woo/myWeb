<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andersen Interactive Digital Library</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@300;500;700&display=swap');
        
        body {
            font-family: 'Noto Serif KR', serif;
            background: linear-gradient(135deg, #090d16 0%, #111827 100%);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .serif-en { font-family: 'Cinzel', serif; }
        
        .library-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('/1002/images/jeremy-thomas-E0AHdsENmDg-unsplash.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.8;
            /* mix-blend-mode: overlay; */ 
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.6s ease;
        }

        /* --- [서재 전용 스타일] --- */
        .wood-shelf {
            background: linear-gradient(to bottom, #4a2c11 0%, #351c07 100%);
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6), 0 8px 16px rgba(0,0,0,0.8);
            border-bottom: 8px solid #241203;
            position: relative;
        }
        .wood-shelf::after {
            content: '';
            position: absolute;
            bottom: -16px; left: 0; right: 0; height: 8px;
            background: rgba(0,0,0,0.4);
            filter: blur(4px);
        }
        .book-item {
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: bottom center;
        }
        .book-item:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7), 0 10px 10px -5px rgba(0, 0, 0, 0.7);
        }

        /* --- [3D 웹뷰어 스테이지 & 고정 척추축] --- */
        .stage {
            perspective: 2200px;
            position: relative;
        }

        /* 확장된 책 크기 (가로 1000px, 세로 680px) */
        .book-container {
            position: fixed;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            width: 1000px;
            height: 680px;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }

        /* 낱개 페이지 (가로 500px, 척추 중심선 고정) */
        .sheet {
            position: absolute;
            top: 0;
            left: 50%;
            width: 500px;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        .page-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            box-shadow: inset 0px 0px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* 뒤집히는 왼쪽 페이지 기준점 및 라운딩 설정 */
        .page-back {
            transform: rotateY(180deg);
            border-radius: 0.75rem 0 0 0.75rem !important;
        }

        /* 오른쪽에 고정되는 페이지 라운딩 설정 */
        .page-face:not(.page-back) {
            border-radius: 0 0.75rem 0.75rem 0 !important;
        }

        .spine-shadow-left {
            background: linear-gradient(to right, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 100%);
        }
        .spine-shadow-right {
            background: linear-gradient(to left, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0) 100%);
        }
        .active-click {
            pointer-events: auto !important;
            cursor: pointer;
        }

        /* 배경 날씨 캔버스 고정 레이어 */
        #weather-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
        }
    </style>
</head>

                    "시골의 여름은 참으로 아름다웠다. 밀밭은 황금빛으로 물들고 귀리는 초록빛을 띠었다. 우엉 잎사귀 아래 엄마 오리가 알을 품고 있었다.",
                    "마침내 거대한 알이 깨졌고, 회색빛의 유독 크고 못생긴 새끼 오리가 밖으로 기어 나왔다.",
                    "농장 마당의 다른 동물들은 미운 오리 새끼를 보자마자 비웃고 괴롭혔다. 오리는 울타리를 넘어 넓은 늪지대로 도망쳤다.",
                    "혹독한 겨울이 찾아왔다. 얼어붙는 호수 위에서 지친 새끼 오리는 눈과 얼음 속에 갇히고 말았다.",
                    "마침내 따뜻한 태양이 비추고 종달새가 노래하는 아름다운 봄이 찾아왔다. 오리는 날개를 활짝 폈다.",
                    "<div class='text-center py-6 text-stone-600 font-medium'><p class='mb-2 text-xl font-bold text-emerald-900'>Fin</p><p class='text-sm leading-relaxed'>물에 비친 자신을 본 오리는 깜짝 놀랐다. 그것은 더 이상 회색 오리가 아니라 세상에서 가장 아름다운 백조였다.</p></div>"
                ],
                illustrations: [
                    "https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=800&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1555881400-74d7acaacd8b?q=80&w=800&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=800&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1483664852095-d6cc6870702d?q=80&w=800&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1470240731273-7821a6eeb6bd?q=80&w=800&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1516570161787-2fd96222ed70?q=80&w=800&auto=format&fit=crop"
                ]
            }
        };

        // 초기 서재 썸네일 세팅
        window.addEventListener('DOMContentLoaded', () => {
            if(bookData.matchgirl.coverImage) document.getElementById('thumb-matchgirl').src = bookData.matchgirl.coverImage;
            if(bookData.mermaid.coverImage) document.getElementById('thumb-mermaid').src = bookData.mermaid.coverImage;
            if(bookData.duckling.coverImage) document.getElementById('thumb-duckling').src = bookData.duckling.coverImage;
        });

        let currentSheet = 0;
        let totalSheets = 0;
        let activeSheets = [];
        let animationFrameId = null;

        const canvas = document.getElementById('weather-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function openBook(bookId) {
            const selectedBook = bookData[bookId];
            if (!selectedBook) return;

            document.body.style.background = selectedBook.bgGradient;
            document.getElementById('viewer-title').innerText = `${selectedBook.title} - ${selectedBook.subTitle}`;
            document.getElementById('theme-icon').innerText = selectedBook.symbol;

            buildBookDOM(selectedBook);

            const shelf = document.getElementById('library-screen');
            const viewer = document.getElementById('viewer-screen');
            
            shelf.classList.add('opacity-0');
            setTimeout(() => {
                shelf.classList.add('hidden');
                viewer.classList.remove('hidden');
                setTimeout(() => {
                    viewer.classList.remove('opacity-0');
                    currentSheet = 0;
                    activeSheets = document.querySelectorAll('.sheet');
                    totalSheets = activeSheets.length;
                    updateInteraction();
                    startWeather(selectedBook.weather);
                }, 50);
            }, 500);
        }

        function closeBook() {
            const shelf = document.getElementById('library-screen');
            const viewer = document.getElementById('viewer-screen');
            
            viewer.classList.add('opacity-0');
            setTimeout(() => {
                viewer.classList.add('hidden');
                shelf.classList.remove('hidden');
                setTimeout(() => {
                    shelf.classList.remove('opacity-0');
                    document.body.style.background = "linear-gradient(135deg, #090d16 0%, #111827 100%)";
                    stopWeather();
                }, 50);
            }, 500);
        }

        // [동적 북 DOM 생성] - 왼쪽: 텍스트 / 오른쪽: 삽화
        function buildBookDOM(book) {
            const bookContainer = document.getElementById('book');
            bookContainer.innerHTML = '';

            const pages = book.pages;
            const illustrations = book.illustrations;
            let htmlStr = '';

            const coverImgHTML = book.coverImage 
                ? `<img src="${book.coverImage}" class="absolute inset-0 w-full h-full object-cover opacity-25 pointer-events-none z-0">` 
                : '';

            // Sheet 1: 표지 + 첫 텍스트 페이지
            htmlStr += `
            <div class="sheet">
                <div class="page-face bg-gradient-to-b ${book.themeClass} border-y border-r ${book.borderColor} flex flex-col justify-between p-10 text-center relative overflow-hidden">
                    ${coverImgHTML}
                    <div class="border-2 border-amber-500/20 w-full h-full flex flex-col justify-between p-8 relative z-10">
                        <div class="absolute top-3 right-3 w-10 h-10 border-t-2 border-r-2 border-amber-400/30"></div>
                        <span class="serif-en text-amber-500/80 text-sm tracking-[0.3em] font-semibold mt-2">[ ${book.subTitle} ]</span>
                        <div class="my-auto space-y-4">
                            <h1 class="text-4xl md:text-5xl font-extrabold text-amber-100 tracking-wide drop-shadow-lg">${book.title}</h1>
                            <p class="text-sm md:text-base text-slate-300 tracking-widest mt-3">${book.author}</p>
                        </div>
                        <div class="mb-2 space-y-3">
                            <div class="text-amber-500 text-3xl animate-pulse">${book.symbol}</div>
                            <span class="text-xs text-slate-300 tracking-widest block bg-slate-900/70 py-2.5 px-4 rounded-lg border border-slate-700/80 backdrop-blur-sm">화면이나 버튼을 클릭하여 책을 넘겨보세요</span>
                        </div>
                    </div>
                </div>
                <div class="page-face page-back bg-[#fdfaf2] text-slate-800 p-12 flex flex-col justify-between border-y border-r border-stone-300">
                    <div class="spine-shadow-left absolute top-0 left-0 w-12 h-full z-10"></div>
                    <article class="text-base md:text-lg leading-relaxed text-justify space-y-4 font-normal text-stone-900">
                        <p class="font-bold text-amber-900 text-xl mb-4 border-b pb-2 border-amber-900/20">〈 ${book.title} 〉</p>
                        <p>${pages[0]}</p>
                    </article>
                    <span class="text-xs text-stone-400 text-left serif-en font-semibold">1</span>
                </div>
            </div>`;

            // 본문 순회: (오른쪽: 이전 텍스트의 삽화 / 왼쪽: 다음 텍스트)
            for (let i = 0; i < pages.length - 1; i++) {
                const currentIllust = illustrations[i] || illustrations[0];
                const nextText = pages[i+1];

                htmlStr += `
                <div class="sheet">
                    <div class="page-face bg-stone-100 flex items-center justify-center border-y border-r border-stone-300 relative overflow-hidden">
                        <div class="spine-shadow-right absolute top-0 right-0 w-12 h-full z-10"></div>
                        <img src="${currentIllust}" alt="삽화" class="w-full h-full object-cover">
                    </div>
                    <div class="page-face page-back bg-[#fdfaf2] text-slate-800 p-12 flex flex-col justify-between border-y border-r border-stone-300">
                        <div class="spine-shadow-left absolute top-0 left-0 w-12 h-full z-10"></div>
                        <article class="text-base md:text-lg leading-relaxed text-justify space-y-4 text-stone-900">
                            <p>${nextText}</p>
                        </article>
                        <span class="text-xs text-stone-400 text-left serif-en font-semibold">${i + 2}</span>
                    </div>
                </div>`;
            }

            // 마지막 엔딩 Sheet (오른쪽 마지막 삽화 + 뒷표지)
            const lastIllust = illustrations[illustrations.length - 1];
            htmlStr += `
            <div class="sheet">
                <div class="page-face bg-stone-100 flex items-center justify-center border-y border-r border-stone-300 relative overflow-hidden">
                    <div class="spine-shadow-right absolute top-0 right-0 w-12 h-full z-10"></div>
                    <img src="${lastIllust}" alt="마지막 삽화" class="w-full h-full object-cover">
                </div>
                <div class="page-face page-back bg-gradient-to-b ${book.themeClass} border-y border-l ${book.borderColor} flex flex-col justify-between p-10 text-center">
                    <div class="border-2 border-amber-500/20 w-full h-full flex flex-col justify-center p-8 relative">
                        <div class="absolute top-3 left-3 w-10 h-10 border-t-2 border-l-2 border-amber-400/30"></div>
                        <h2 class="serif-en text-amber-500/50 text-2xl tracking-[0.4em] mb-3 font-bold">THE END</h2>
                        <p class="text-xs text-slate-400 tracking-wider">Digital Masterpiece Collection</p>
                    </div>
                </div>
            </div>`;

            bookContainer.innerHTML = htmlStr;
        }

        function updateInteraction() {
            activeSheets.forEach((sheet, index) => {
                const frontFace = sheet.querySelector('.page-face:not(.page-back)');
                const backFace = sheet.querySelector('.page-face.page-back');

                if (index < currentSheet) {
                    sheet.style.transform = "rotateY(-180deg)";
                    sheet.style.zIndex = index + 1;
                    
                    if(frontFace) frontFace.classList.remove('active-click');
                    if(backFace) backFace.classList.add('active-click');
                } else {
                    sheet.style.transform = "rotateY(0deg)";
                    sheet.style.zIndex = totalSheets - index;

                    if(frontFace) frontFace.classList.add('active-click');
                    if(backFace) backFace.classList.remove('active-click');
                }
            });

            document.querySelectorAll('.active-click').forEach(face => {
                face.onclick = function(e) {
                    e.stopPropagation();
                    if (this.classList.contains('page-back')) {
                        prevPage();
                    } else {
                        nextPage();
                    }
                };
            });

            document.getElementById('page-indicator').innerText = `SHEET ${currentSheet} / ${totalSheets}`;
        }

        function nextPage() {
            if (currentSheet < totalSheets) {
                currentSheet++;
                updateInteraction();
            }
        }

        function prevPage() {
            if (currentSheet > 0) {
                currentSheet--;
                updateInteraction();
            }
        }

        window.addEventListener('keydown', (e) => {
            const viewer = document.getElementById('viewer-screen');
            if (!viewer.classList.contains('hidden')) {
                if (e.key === 'ArrowRight') nextPage();
                if (e.key === 'ArrowLeft') prevPage();
                if (e.key === 'Escape') closeBook();
            }
        });

        // 배경 파티클 파티클 효과 (눈/방울/깃털)
        function startWeather(type) {
            stopWeather();
            particles = [];
            let maxParticles = 60;

            if (type === 'snow') {
                for (let i = 0; i < maxParticles; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * 3 + 1,
                        d: Math.random() * 1 + 0.5,
                        v: Math.random() * 1 - 0.5
                    });
                }
            } else if (type === 'bubble') {
                for (let i = 0; i < maxParticles; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: canvas.height + Math.random() * 100,
                        r: Math.random() * 5 + 2,
                        speed: Math.random() * 1.5 + 0.5,
                        wobble: Math.random() * 0.02,
                        wobbleAmt: Math.random() * 2
                    });
                }
            } else if (type === 'feather') {
                for (let i = 0; i < 30; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        w: Math.random() * 12 + 6,
                        h: Math.random() * 4 + 2,
                        speedX: Math.random() * 1 + 0.5,
                        speedY: Math.random() * 0.5 + 0.2,
                        angle: Math.random() * Math.PI
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (type === 'snow') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                    ctx.beginPath();
                    for (let i = 0; i < particles.length; i++) {
                        let p = particles[i];
                        ctx.moveTo(p.x, p.y);
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);

                        p.y += p.d;
                        p.x += p.v;

                        if (p.y > canvas.height) {
                            particles[i] = { x: Math.random() * canvas.width, y: -10, r: p.r, d: p.d, v: p.v };
                        }
                    }
                    ctx.fill();
                } else if (type === 'bubble') {
                    ctx.strokeStyle = 'rgba(103, 232, 249, 0.4)';
                    ctx.fillStyle = 'rgba(103, 232, 249, 0.08)';
                    for (let i = 0; i < particles.length; i++) {
                        let p = particles[i];
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
                        ctx.stroke();
                        ctx.fill();

                        p.y -= p.speed;
                        p.x += Math.sin(p.wobbleAmt) * 0.4;
                        p.wobbleAmt += p.wobble;

                        if (p.y < -20) {
                            particles[i] = { x: Math.random() * canvas.width, y: canvas.height + 20, r: p.r, speed: p.speed, wobble: p.wobble, wobbleAmt: p.wobbleAmt };
                        }
                    }
                } else if (type === 'feather') {
                    ctx.fillStyle = 'rgba(209, 250, 229, 0.35)';
                    for (let i = 0; i < particles.length; i++) {
                        let p = particles[i];
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.angle);
                        ctx.beginPath();
                        ctx.ellipse(0, 0, p.w, p.h, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();

                        p.x += p.speedX;
                        p.y += p.speedY;
                        p.angle += 0.01;

                        if (p.x > canvas.width || p.y > canvas.height) {
                            particles[i] = { x: -20, y: Math.random() * canvas.height, w: p.w, h: p.h, speedX: p.speedX, speedY: p.speedY, angle: p.angle };
                        }
                    }
                }
                animationFrameId = requestAnimationFrame(draw);
            }
            draw();
        }

        function stopWeather() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
</body>
</html>
