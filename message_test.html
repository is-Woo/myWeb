<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Style Birthday Intro</title>
    <style>
        /* 기본 배경 및 폰트 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            letter-spacing: -0.05em;
        }

        /* 폭죽 캔버스 레이어 */
        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* ==========================================
           [0단계] 첫 화면: 스타트 버튼 및 대기 화면
           ========================================== */
        .start-screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            z-index: 10;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .start-title {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }
        .start-btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s;
            font-family: inherit;
        }
        .start-btn:hover {
            transform: scale(1.05);
            background-color: #e5e5e5;
        }
        .start-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 768px) {
            .start-title { font-size: 2.2rem; }
            .start-btn { padding: 12px 28px; font-size: 1rem; }
        }

        body.is-active .start-screen {
            opacity: 0;
            visibility: hidden;
        }

        /* ==========================================
           인트로 컨테이너 및 기본 단어 설정
           ========================================== */
        .intro-container {
            position: relative;
            font-size: 7.5rem;
            text-align: center;
            text-transform: uppercase;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            z-index: 2;
        }

        @media (max-width: 768px) {
            .intro-container { font-size: 3.5rem; }
        }

        .word {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1.5);
            opacity: 0;
            width: 100%;
            white-space: nowrap;
        }

        body.is-active .intro-container {
            visibility: visible;
        }

        /* 1파트: 질문 */
        body.is-active .q1 { animation: popText 0.4s ease-out 0.1s forwards; }
        body.is-active .q2 { animation: popText 0.4s ease-out 0.5s forwards; }
        body.is-active .q3 { animation: popText 0.4s ease-out 0.9s forwards; }
        body.is-active .q4 { animation: popText 0.4s ease-out 1.3s forwards; }

        /* 2파트: 감성 문구 */
        body.is-active .w1 { animation: popText 0.4s ease-out 1.9s forwards; }
        body.is-active .w2 { animation: popText 0.4s ease-out 2.3s forwards; }
        body.is-active .w3 { animation: popText 0.4s ease-out 2.7s forwards; }
        body.is-active .w4 { animation: finalZoom 1.2s cubic-bezier(0.16, 1, 0.3, 1) 3.1s forwards; }

        @keyframes popText {
            0% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; filter: blur(8px); }
            15% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; filter: blur(0px); }
            85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0; }
        }

        @keyframes finalZoom {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; filter: blur(5px); }
            20% { transform: translate(-50%, -50%) scale(1); opacity: 1; filter: blur(0px); }
            65% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; visibility: hidden; }
        }

        /* ==========================================
           [3단계] 정중앙 자바스크립트 타이핑 박스 영역
           ========================================== */
        .full-message-box {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .line {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 400;
            color: #d4d4d4;
            letter-spacing: -0.02em;
            text-align: center;
            display: inline-block;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .line.line-1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
        }

        @media (max-width: 768px) {
            .line { font-size: 1.1rem; }
            .line.line-1 { font-size: 1.6rem; }
        }

        /* 커서 효과: 항상 글자 맨 뒤에 밀착 */
        .cursor::after {
            content: "|";
            display: inline-block;
            margin-left: 2px;
            color: #fff;
            animation: blink 0.75s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .line.fade-out {
            opacity: 0 !important;
            transform: translateY(-10px) !important;
        }
    </style>
</head>
<body>
    <canvas id="fireworksCanvas"></canvas>
    <audio id="introAudio" src="https://mixkit.co" preload="auto"></audio>

    <div class="start-screen" id="startScreen">
        <h1 class="start-title">준비됐나요?</h1>
        <button class="start-btn" onclick="startIntro()">시작하기</button>
    </div>

    <div class="intro-container">
        <span class="word q1">지금</span>
        <span class="word q2">생각나는</span>
        <span class="word q3">사람이</span>
        <span class="word q4">있나요?</span>

        <span class="word w1">그 시절</span>
        <span class="word w2">그 거리</span>
        <span class="word w3">그리고</span>
        <span class="word w4">당신</span>

        <div class="full-message-box">
            <span class="line line-1" id="line1"></span>
            <span class="line line-2" id="line2"></span>
            <span class="line line-3" id="line3"></span>
            <span class="line line-4" id="line4"></span>
        </div>
    </div>

    <script>
        const messages = [
            { id: 'line1', text: '생일 축하해! ✨', speed: 80, delay: 4100, duration: 3000 },
            { id: 'line2', text: '언제나 내 가장 소중한 기억 속에', speed: 70, delay: 7200, duration: 3200 },
            { id: 'line3', text: '기적처럼 함께해 줘서 고마워.', speed: 70, delay: 10500, duration: 3400 },
            { id: 'line4', text: '오늘 너의 하루가 가장 빛나기를 바랄게.', speed: 75, delay: 14000, isLast: true }
        ];

        function startIntro() {
            document.body.classList.add('is-active');

            // 타이핑 스케줄링 실행
            messages.forEach(msg => {
                setTimeout(() => {
                    typeMessage(msg);
                }, msg.delay);
            });
        }

        function typeMessage(msgConfig) {
            const el = document.getElementById(msgConfig.id);
            el.style.opacity = '1';
            el.classList.add('cursor');
            
            let index = 0;
            const timer = setInterval(() => {
                if (index < msgConfig.text.length) {
                    el.textContent += msgConfig.text.charAt(index);
                    index++;
                } else {
                    clearInterval(timer);
                    
                    // 마지막 문장 타이핑 완료 시 폭죽 실행
                    if (msgConfig.isLast) {
                        launchFireworks();
                    } else {
                        // 다음 문장 전환 전 부드럽게 퇴장
                        setTimeout(() => {
                            el.classList.add('fade-out');
                            setTimeout(() => {
                                el.classList.remove('cursor');
                            }, 400);
                        }, msgConfig.duration - (msgConfig.text.length * msgConfig.speed) - 400);
                    }
                }
            }, msgConfig.speed);
        }

        /* ==========================================
           [폭죽 애니메이션 엔진]
           ========================================== */
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.008;
                this.gravity = 0.08;
            }

            update() {
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            const colors = ['#ff4d4d', '#ffbc00', '#2ed573', '#1e90ff', '#a55eea', '#ffffff'];
            const count = 70;
            for (let i = 0; i < count; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateFireworks);
        }

        function launchFireworks() {
            animateFireworks();
            
            let timer = setInterval(() => {
                const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
                const y = Math.random() * canvas.height * 0.5 + canvas.height * 0.1;
                createExplosion(x, y);
            }, 300);

            setTimeout(() => {
                clearInterval(timer);
            }, 3800);
        }
    </script>
</body>
</html>
