<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 | My Hub</title>
    <style>
        /* 기본 스타일 리셋 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* 헤더 영역 */
        header {
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111111;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 0.9rem;
            color: #767676;
        }

        /* 카드 선택 영역 */
        .choice {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .choice-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 24px;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #f0f0f0;
            transition: all 0.25s ease;
        }

        /* 호버 애니메이션 효과 */
        .choice-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border-color: #e2e2e2;
        }

        .card-info {
            text-align: left;
        }

        .card-info h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #222222;
            margin-bottom: 4px;
        }

        .card-info p {
            font-size: 0.85rem;
            color: #888888;
        }

        .card-icon {
            font-size: 1.2rem;
            color: #b0b0b0;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .choice-card:hover .card-icon {
            color: #111111;
            transform: translateX(4px);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>WELCOME</h1>
            <p>이동할 페이지를 선택해 주세요.</p>
        </header>

        <main class="choice">
            <!-- 편지 페이지 링크 -->
            <a href="message_test.html" class="choice-card">
                <div class="card-info">
                    <h3>편지</h3>
                    <p>메시지 확인하기</p>
                </div>
                <span class="card-icon">&rarr;</span>
            </a>

            <!-- 책 뷰어 페이지 링크 -->
            <a href="book_webview.html" class="choice-card">
                <div class="card-info">
                    <h3>책 뷰어</h3>
                    <p>도서 뷰어 이동하기</p>
                </div>
                <span class="card-icon">&rarr;</span>
            </a>
        </main>
    </div>

</body>
</html>
